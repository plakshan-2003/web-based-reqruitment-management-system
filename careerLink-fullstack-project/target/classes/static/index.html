<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerLink - Admin Job Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for Reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        /* IT Workspace Background with subtle dark overlay */
        .tech-bg {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="tech-bg min-h-screen text-gray-800 antialiased" x-data="jobManager()">

<!-- Top Navigation Bar (Slight Transparency) -->
<header class="bg-white/90 backdrop-blur-md border-b border-gray-200/50 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10 shadow-md">
                <i class="fa-solid fa-briefcase"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">CareerLink Admin</h1>
                <p class="text-xs text-gray-500">Job Posting Management System</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-gray-100/80 px-3 py-1.5 rounded-lg border border-gray-200">
                <label for="staffIdInput" class="text-xs font-medium text-gray-600">Active Staff ID:</label>
                <input id="staffIdInput" type="number" x-model.number="currentStaffId" class="w-16 bg-white border border-gray-300 rounded px-2 py-0.5 text-sm text-center font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button @click="openCreateModal()" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition-all">
                <i class="fa-solid fa-plus"></i>
                <span>Post New Job</span>
            </button>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Notification Toast -->
    <template x-if="notification.message">
        <div :class="notification.type === 'success' ? 'bg-emerald-50/90 border-emerald-200 text-emerald-800' : 'bg-rose-50/90 border-rose-200 text-rose-800'" class="mb-6 border backdrop-blur-md p-4 rounded-xl flex items-center justify-between shadow-sm transition-all">
            <div class="flex items-center space-x-3">
                <i :class="notification.type === 'success' ? 'fa-solid fa-circle-check text-emerald-600' : 'fa-solid fa-circle-exclamation text-rose-600'" class="text-lg"></i>
                <span class="text-sm font-medium" x-text="notification.message"></span>
            </div>
            <button @click="notification.message = ''" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </template>

    <!-- Stats Overview Cards (Transparent Look) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-white/20 shadow-sm flex items-center space-x-4">
            <div class="bg-indigo-50 text-indigo-600 p-3.5 rounded-xl text-xl">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Total Loaded Jobs</p>
                <h3 class="text-2xl font-bold text-gray-900 mt-1" x-text="jobs.length">0</h3>
            </div>
        </div>
        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-white/20 shadow-sm flex items-center space-x-4">
            <div class="bg-emerald-50 text-emerald-600 p-3.5 rounded-xl text-xl">
                <i class="fa-solid fa-globe"></i>
            </div>
            <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Published Status</p>
                <h3 class="text-2xl font-bold text-gray-900 mt-1" x-text="jobs.filter(j => j.status === 'PUBLISHED').length">0</h3>
            </div>
        </div>
        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border border-white/20 shadow-sm flex items-center space-x-4">
            <div class="bg-amber-50 text-amber-600 p-3.5 rounded-xl text-xl">
                <i class="fa-solid fa-file-pen"></i>
            </div>
            <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Drafts & Others</p>
                <h3 class="text-2xl font-bold text-gray-900 mt-1" x-text="jobs.filter(j => j.status !== 'PUBLISHED').length">0</h3>
            </div>
        </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl border border-white/20 p-4 mb-6 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            <!-- Status Filter Dropdown -->
            <select x-model="selectedStatusFilter" @change="fetchJobsByStatus()" class="bg-gray-50 border border-gray-300 text-gray-700 text-sm rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="UNPUBLISHED">Status: Unpublished</option>
                <option value="PUBLISHED">Status: Published</option>
                <option value="DRAFT">Status: Draft</option>
                <option value="ARCHIVED">Status: Archived</option>
            </select>

            <!-- Search Input -->
            <div class="relative flex-1 md:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search text-xs"></i></span>
                <input type="text" x-model="searchKeyword" @keyup.enter="performSearch()" placeholder="Search keyword..." class="w-full pl-9 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button @click="performSearch()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-all">Search</button>
        </div>
        <div>
            <button @click="loadAllJobs()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 flex items-center space-x-1 bg-indigo-50/50 px-3 py-1.5 rounded-lg">
                <i class="fa-solid fa-rotate-right text-xs"></i>
                <span>Reset Filters</span>
            </button>
        </div>
    </div>

    <!-- Job Postings Table Container -->
    <div class="bg-white/95 backdrop-blur-md rounded-2xl border border-white/20 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 text-left">
                <thead class="bg-gray-50/80 text-gray-500 uppercase text-xs tracking-wider">
                <tr>
                    <th class="px-6 py-4 font-semibold">Job Details</th>
                    <th class="px-6 py-4 font-semibold">Category / Location</th>
                    <th class="px-6 py-4 font-semibold">Salary / Deadline</th>
                    <th class="px-6 py-4 font-semibold">Status</th>
                    <th class="px-6 py-4 font-semibold text-right">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 text-sm bg-white/50">
                <template x-if="jobs.length === 0">
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                            <i class="fa-solid fa-folder-open text-3xl mb-2 text-gray-400"></i>
                            <p class="font-medium">No job postings found for status: <span x-text="selectedStatusFilter" class="font-semibold underline"></span>.</p>
                            <p class="text-xs text-gray-400 mt-1">Change the Status dropdown filter above to match your database records.</p>
                        </td>
                    </tr>
                </template>
                <template x-for="job in jobs" :key="job.jobId">
                    <tr class="hover:bg-white/80 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-bold text-gray-900" x-text="job.title"></div>
                            <div class="text-xs text-gray-500 line-clamp-1 mt-0.5" x-text="job.description"></div>
                            <div class="flex flex-wrap gap-1 mt-1.5">
                                <template x-for="tag in job.tags">
                                    <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-md font-medium" x-text="tag"></span>
                                </template>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="font-medium text-gray-800" x-text="job.category || 'N/A'"></div>
                            <div class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i><span x-text="job.location || 'Remote/Not specified'"></span></div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="font-semibold text-emerald-600" x-text="job.salary ? '\$' + job.salary.toLocaleString() : 'Negotiable'"></div>
                            <div class="text-xs text-gray-500 mt-0.5"><i class="fa-regular fa-calendar mr-1"></i><span x-text="job.deadline || 'No deadline'"></span></div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                                    <span :class="{
                                        'bg-emerald-50 text-emerald-700 border-emerald-200': job.status === 'PUBLISHED',
                                        'bg-amber-50 text-amber-700 border-amber-200': job.status === 'DRAFT' || job.status === 'UNPUBLISHED',
                                        'bg-gray-100 text-gray-700 border-gray-300': job.status === 'ARCHIVED'
                                    }" class="px-3 py-1 rounded-full text-xs font-semibold border inline-block" x-text="job.status"></span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
                            <!-- Status Toggle Buttons -->
                            <template x-if="job.status !== 'PUBLISHED'">
                                <button @click="changeStatus(job.jobId, 'publish')" title="Publish" class="text-emerald-600 hover:text-emerald-800 p-1.5 rounded bg-emerald-50 hover:bg-emerald-100 transition-colors">
                                    <i class="fa-solid fa-eye text-xs"></i>
                                </button>
                            </template>
                            <template x-if="job.status === 'PUBLISHED'">
                                <button @click="changeStatus(job.jobId, 'unpublish')" title="Unpublish" class="text-amber-600 hover:text-amber-800 p-1.5 rounded bg-amber-50 hover:bg-amber-100 transition-colors">
                                    <i class="fa-solid fa-eye-slash text-xs"></i>
                                </button>
                            </template>
                            <template x-if="job.status !== 'ARCHIVED'">
                                <button @click="changeStatus(job.jobId, 'archive')" title="Archive" class="text-gray-500 hover:text-gray-700 p-1.5 rounded bg-gray-100 hover:bg-gray-200 transition-colors">
                                    <i class="fa-solid fa-box-archive text-xs"></i>
                                </button>
                            </template>
                            <!-- Edit & Delete -->
                            <button @click="openEditModal(job)" title="Edit" class="text-indigo-600 hover:text-indigo-800 p-1.5 rounded bg-indigo-50 hover:bg-indigo-100 transition-colors">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button @click="deleteJob(job.jobId)" title="Delete Permanently" class="text-rose-600 hover:text-rose-800 p-1.5 rounded bg-rose-50 hover:bg-rose-100 transition-colors">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Form (Create / Edit) -->
<div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-200 transform transition-all" @click.away="showModal = false">
        <div class="flex justify-between items-center pb-4 border-b border-gray-100 mb-4">
            <h3 class="text-lg font-bold text-gray-900" x-text="isEditMode ? 'Edit Job Posting' : 'Create Job Posting'"></h3>
            <button @click="showModal = false" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <form @submit.prevent="submitForm()" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Job Title *</label>
                <input type="text" x-model="form.title" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Category</label>
                    <input type="text" x-model="form.category" placeholder="e.g. Engineering" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Location</label>
                    <input type="text" x-model="form.location" placeholder="e.g. Colombo, LK" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Salary (\$)</label>
                    <input type="number" step="any" x-model.number="form.salary" placeholder="1500.00" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Deadline</label>
                    <input type="date" x-model="form.deadline" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Tags (comma-separated)</label>
                <input type="text" x-model="form.tagsInput" placeholder="Java, Spring Boot, Remote" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Description</label>
                <textarea x-model="form.description" rows="4" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                <button type="button" @click="showModal = false" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium transition-all">Cancel</button>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-sm font-medium shadow transition-all" x-text="isEditMode ? 'Save Changes' : 'Publish Job'"></button>
            </div>
        </form>
    </div>
</div>

<!-- JavaScript App Logic -->
<script>
    const API_BASE_URL = 'http://localhost:8080/api/jobs';

    function jobManager() {
        return {
            jobs: [],
            currentStaffId: 1,
            selectedStatusFilter: 'UNPUBLISHED',
            searchKeyword: '',
            showModal: false,
            isEditMode: false,
            editJobId: null,
            notification: { message: '', type: 'success' },
            form: {
                title: '',
                description: '',
                category: '',
                location: '',
                salary: '',
                deadline: '',
                tagsInput: ''
            },

            init() {
                this.fetchJobsByStatus();
            },

            showToast(message, type = 'success') {
                this.notification = { message, type };
                setTimeout(() => { if(this.notification.message === message) this.notification.message = ''; }, 5000);
            },

            async fetchJobsByStatus() {
                try {
                    const response = await fetch(`${API_BASE_URL}?status=${this.selectedStatusFilter}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    this.jobs = await response.json();
                } catch (error) {
                    console.error("Fetch jobs error:", error);
                    this.showToast("Cannot connect to Spring Boot backend. Check if server is running on port 8080.", 'error');
                }
            },

            async loadAllJobs() {
                this.searchKeyword = '';
                this.selectedStatusFilter = 'UNPUBLISHED';
                this.fetchJobsByStatus();
            },

            async performSearch() {
                if (!this.searchKeyword.trim()) {
                    this.fetchJobsByStatus();
                    return;
                }
                try {
                    const response = await fetch(`${API_BASE_URL}/search?keyword=${encodeURIComponent(this.searchKeyword)}`);
                    if (!response.ok) throw new Error("Search request failed");
                    this.jobs = await response.json();
                } catch (error) {
                    this.showToast("Search failed. Check backend connection.", 'error');
                }
            },

            openCreateModal() {
                this.isEditMode = false;
                this.editJobId = null;
                this.form = { title: '', description: '', category: '', location: '', salary: '', deadline: '', tagsInput: '' };
                this.showModal = true;
            },

            openEditModal(job) {
                this.isEditMode = true;
                this.editJobId = job.jobId;
                this.form = {
                    title: job.title || '',
                    description: job.description || '',
                    category: job.category || '',
                    location: job.location || '',
                    salary: job.salary || '',
                    deadline: job.deadline || '',
                    tagsInput: job.tags ? job.tags.join(', ') : ''
                };
                this.showModal = true;
            },

            async submitForm() {
                const tagsArray = this.form.tagsInput ? this.form.tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];
                const payload = {
                    title: this.form.title,
                    description: this.form.description,
                    category: this.form.category,
                    location: this.form.location,
                    salary: this.form.salary ? parseFloat(this.form.salary) : null,
                    deadline: this.form.deadline ? this.form.deadline : null,
                    tags: tagsArray
                };

                try {
                    let response;
                    if (this.isEditMode) {
                        response = await fetch(`${API_BASE_URL}/${this.editJobId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    } else {
                        response = await fetch(`${API_BASE_URL}/staff/${this.currentStaffId}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    }

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(errText || "Operation failed. Verify Active Staff ID exists in DB.");
                    }

                    this.showModal = false;
                    this.showToast(this.isEditMode ? 'Job updated successfully!' : 'Job created successfully!');
                    this.fetchJobsByStatus();
                } catch (error) {
                    this.showToast(error.message, 'error');
                }
            },

            async changeStatus(jobId, action) {
                try {
                    const response = await fetch(`${API_BASE_URL}/${jobId}/${action}`, { method: 'PUT' });
                    if (!response.ok) throw new Error(`Failed to ${action} job`);
                    this.showToast(`Job successfully ${action}ed!`);
                    this.fetchJobsByStatus();
                } catch (error) {
                    this.showToast(error.message, 'error');
                }
            },

            async deleteJob(jobId) {
                if (!confirm("Are you sure you want to permanently delete this job posting?")) return;
                try {
                    const response = await fetch(`${API_BASE_URL}/${jobId}`, { method: 'DELETE' });
                    if (!response.ok) throw new Error("Failed to delete job");
                    this.showToast('Job permanently deleted.');
                    this.fetchJobsByStatus();
                } catch (error) {
                    this.showToast(error.message, 'error');
                }
            }
        }
    }
</script>
</body>
</html>
