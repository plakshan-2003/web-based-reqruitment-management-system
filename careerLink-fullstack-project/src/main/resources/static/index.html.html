<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerLink - Job Posting Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        /* Custom Smooth Transition */
        .transition-all-custom {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                    <i class="bi bi-briefcase-fill text-xl"></i>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">CareerLink Portal</span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm font-medium text-slate-500 hidden sm:inline">Staff ID: <strong id="currentStaffId" class="text-indigo-600">1</strong></span>
                <button onclick="openModal('create')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-medium text-sm shadow-lg shadow-indigo-200 transition-all-custom transform hover:-translate-y-0.5 flex items-center space-x-2">
                    <i class="bi bi-plus-lg"></i>
                    <span>Post New Job</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Header Banner -->
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Job Postings Dashboard</h1>
                <p class="text-sm text-slate-500 mt-1">Manage, update, and track all active job opportunities from your department.</p>
            </div>
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search jobs..." class="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64 shadow-sm">
                    <i class="bi bi-search absolute left-3 top-2.5 text-slate-400"></i>
                </div>
                <button onclick="fetchJobs()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 p-2 rounded-xl shadow-sm transition-all-custom" title="Refresh">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all-custom transform duration-300"></div>

        <!-- Job Cards Grid Container -->
        <div id="jobContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Will Be Injected Here -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="bi bi-inbox"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-700">No Job Postings Found</h3>
            <p class="text-sm text-slate-400 mt-1">Get started by creating your first job posting vacancy.</p>
        </div>
    </main>

    <!-- Modal Form (Create / Edit) -->
    <div id="jobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="glass-card bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 transform transition-all transform scale-95 opacity-0 duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900">Create New Job Posting</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="jobForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="jobId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Job Title</label>
                    <input type="text" id="title" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Category</label>
                        <input type="text" id="category" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Location</label>
                        <input type="text" id="location" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Salary (LKR)</label>
                        <input type="number" step="0.01" id="salary" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Deadline</label>
                        <input type="date" id="deadline" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Description</label>
                    <textarea id="description" rows="3" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-all">Cancel</button>
                    <button type="submit" id="submitBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-lg shadow-indigo-200 transition-all">Save Posting</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const API_BASE_URL = 'http://localhost:8080/api/jobs';
        const STAFF_ID = 1; // Default mapped staff ID from database
        let allJobs = [];

        // Fetch all jobs on window load
        window.onload = () => {
            fetchJobs();
        };

        // Show Toast Notification
        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `mb-6 p-4 rounded-xl text-sm font-medium transition-all-custom ${
                type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'
            }`;
            alertBox.innerHTML = `<div class="flex items-center space-x-2"><i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} text-lg"></i><span>${message}</span></div>`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 4000);
        }

        // Fetch Jobs from Spring Boot Backend
        async function fetchJobs() {
            try {
                const response = await fetch(API_BASE_URL);
                if (!response.ok) throw new Error('Failed to fetch jobs.');
                allJobs = await response.json();
                renderJobs(allJobs);
            } catch (error) {
                console.error(error);
                showAlert('Could not connect to backend server. Ensure Spring Boot is running.', 'error');
            }
        }

        // Render Job Cards with Smooth Transitions
        function renderJobs(jobs) {
            const container = document.getElementById('jobContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            if (!jobs || jobs.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            jobs.forEach((job, index) => {
                // Support both `job_id` or `id` mapping
                const jobId = job.job_id || job.id;
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition-all-custom transform hover:-translate-y-1 p-6 flex flex-col justify-between opacity-0 translate-y-4 animate-fade-in`;
                card.style.animation = `fadeInUp 0.4s ease forwards ${index * 0.08}s`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-semibold tracking-wide">${job.category || 'General'}</span>
                            <span class="text-xs text-slate-400 font-medium"><i class="bi bi-calendar3 mr-1"></i>${job.deadline || 'No Deadline'}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${job.title}</h3>
                        <p class="text-xs text-slate-500 mb-3 flex items-center"><i class="bi bi-geo-alt-fill text-rose-500 mr-1"></i>${job.location || 'Remote'}</p>
                        <p class="text-slate-600 text-sm line-clamp-2 mb-4">${job.description}</p>
                    </div>
                    <div>
                        <div class="flex items-center justify-between pt-4 border-t border-slate-100 mb-4">
                            <span class="text-xs font-medium text-slate-400">Salary Offer</span>
                            <span class="text-emerald-600 font-bold text-sm">LKR ${Number(job.salary || 0).toLocaleString()}</span>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick='openModal("edit", ${JSON.stringify(job)})' class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-center space-x-1">
                                <i class="bi bi-pencil-square"></i><span>Edit</span>
                            </button>
                            <button onclick="deleteJob(${jobId})" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 py-2 rounded-xl text-xs font-semibold transition-all flex items-center justify-center space-x-1">
                                <i class="bi bi-trash3"></i><span>Delete</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search Filter Listener
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allJobs.filter(j => 
                j.title.toLowerCase().includes(query) || 
                j.category.toLowerCase().includes(query) || 
                j.location.toLowerCase().includes(query)
            );
            renderJobs(filtered);
        });

        // Modal Controls
        function openModal(mode, job = null) {
            const modal = document.getElementById('jobModal');
            const modalContent = document.getElementById('modalContent');
            const titleEl = document.getElementById('modalTitle');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            if (mode === 'edit' && job) {
                titleEl.innerText = 'Edit Job Posting';
                document.getElementById('jobId').value = job.job_id || job.id;
                document.getElementById('title').value = job.title;
                document.getElementById('category').value = job.category;
                document.getElementById('location').value = job.location;
                document.getElementById('salary').value = job.salary;
                document.getElementById('deadline').value = job.deadline;
                document.getElementById('description').value = job.description;
            } else {
                titleEl.innerText = 'Create New Job Posting';
                document.getElementById('jobForm').reset();
                document.getElementById('jobId').value = '';
            }
        }

        function closeModal() {
            const modal = document.getElementById('jobModal');
            const modalContent = document.getElementById('modalContent');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // Form Submit Handler (POST for Create, PUT for Update)
        async function handleFormSubmit(event) {
            event.preventDefault();
            const jobId = document.getElementById('jobId').value;
            const payload = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                salary: parseFloat(document.getElementById('salary').value),
                deadline: document.getElementById('deadline').value,
                description: document.getElementById('description').value
            };

            try {
                let response;
                if (jobId) {
                    // Update existing record
                    response = await fetch(`${API_BASE_URL}/${jobId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    // Create new record bound to Staff ID 1
                    response = await fetch(`${API_BASE_URL}/staff/${STAFF_ID}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (!response.ok) throw new Error('Operation failed.');

                showAlert(jobId ? 'Job posting successfully updated!' : 'Job posting created successfully!');
                closeModal();
                fetchJobs();
            } catch (error) {
                console.error(error);
                showAlert('Failed to save job posting. Please check input parameters.', 'error');
            }
        }

        // Delete Job Posting
        async function deleteJob(id) {
            if (!confirm('Are you sure you want to delete this job posting?')) return;
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Delete failed.');
                showAlert('Job posting deleted successfully!');
                fetchJobs();
            } catch (error) {
                console.error(error);
                showAlert('Failed to delete job posting.', 'error');
            }
        }
    </script>
    
    <!-- Animation Keyframes Style -->
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
