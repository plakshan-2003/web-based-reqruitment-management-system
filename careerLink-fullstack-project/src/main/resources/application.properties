spring.application.name=careerlink-backend

# --- SQL Server (SSMS) - Windows Authentication, default instance ---
spring.datasource.url=jdbc:sqlserver://DESKTOP-BGF5T40;databaseName=careerlinkDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true;loginTimeout=5
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.port=8080

spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=true